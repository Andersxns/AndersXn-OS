# shellcheck shell=bash
#
# AndersXn OS - master build configuration.
#
# Every value here can be overridden from the environment, so CI and one-off
# local builds never need to edit this file:
#
#     AXOS_ARCH=arm64 AXOS_SUITE=sid ./build/build.sh
#
# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
AXOS_NAME="${AXOS_NAME:-AndersXn OS}"
AXOS_ID="${AXOS_ID:-andersxn}"
AXOS_VERSION="${AXOS_VERSION:-1.0}"
AXOS_CODENAME="${AXOS_CODENAME:-Summit}"
AXOS_HOME_URL="${AXOS_HOME_URL:-https://andersxn.ggstudios.org}"
AXOS_SUPPORT_URL="${AXOS_SUPPORT_URL:-https://andersxn.ggstudios.org}"
AXOS_BUG_URL="${AXOS_BUG_URL:-https://github.com/Andersxns/AndersXn-OS/issues}"
AXOS_VENDOR="${AXOS_VENDOR:-GG Studios}"

# ---------------------------------------------------------------------------
# Target architecture
#
# amd64 -> x86_64, UEFI + legacy BIOS via Limine
# arm64 -> AArch64, UEFI only (plus a raw image for SBC/UEFI-less boards)
# ---------------------------------------------------------------------------
AXOS_ARCH="${AXOS_ARCH:-amd64}"

# ---------------------------------------------------------------------------
# Upstream base
#
# Debian is used as the bootstrap foundation. It is the only base that gives a
# first-class story on BOTH amd64 and arm64 while also carrying official
# upstream repositories for Docker, Tailscale, Jellyfin and K3s - which is
# exactly the software the homelab provisioning selector deploys.
# ---------------------------------------------------------------------------
AXOS_SUITE="${AXOS_SUITE:-trixie}"
AXOS_MIRROR="${AXOS_MIRROR:-http://deb.debian.org/debian}"
AXOS_SECURITY_MIRROR="${AXOS_SECURITY_MIRROR:-http://security.debian.org/debian-security}"
AXOS_COMPONENTS="${AXOS_COMPONENTS:-main contrib non-free-firmware}"

# Keyring used to verify the base repositories.
#
# Named explicitly rather than left to apt's default because the build host is
# frequently NOT Debian - on an Ubuntu host the default keyring has Ubuntu's
# keys and every Debian Release file fails with NO_PUBKEY. Install it with:
#     apt-get install debian-archive-keyring
AXOS_KEYRING="${AXOS_KEYRING:-/usr/share/keyrings/debian-archive-keyring.gpg}"

# ---------------------------------------------------------------------------
# Kernel
#
# "distro"   - Debian's packaged mainline kernel (fast builds, signed, sane).
# "mainline" - build vanilla kernel.org sources with the AndersXn config
#              fragment in build/config/kernel-axos.fragment (slow).
# ---------------------------------------------------------------------------
AXOS_KERNEL_FLAVOUR="${AXOS_KERNEL_FLAVOUR:-distro}"
AXOS_KERNEL_VERSION="${AXOS_KERNEL_VERSION:-6.12.43}"

# ---------------------------------------------------------------------------
# Bootloader - STRICTLY NO GRUB.
#
# "limine"       - UEFI + legacy BIOS, both architectures. Default.
# "systemd-boot" - UEFI only. Lighter, but no BIOS fallback.
# ---------------------------------------------------------------------------
AXOS_BOOTLOADER="${AXOS_BOOTLOADER:-limine}"
AXOS_LIMINE_VERSION="${AXOS_LIMINE_VERSION:-9.2.3}"
AXOS_LIMINE_REPO="${AXOS_LIMINE_REPO:-https://github.com/limine-bootloader/limine.git}"

# ---------------------------------------------------------------------------
# Filesystem defaults offered by AX-Installer
# ---------------------------------------------------------------------------
AXOS_DEFAULT_FS="${AXOS_DEFAULT_FS:-btrfs}"
AXOS_ESP_SIZE_MIB="${AXOS_ESP_SIZE_MIB:-1024}"
AXOS_BTRFS_OPTS="${AXOS_BTRFS_OPTS:-noatime,compress=zstd:3,ssd,space_cache=v2}"

# ---------------------------------------------------------------------------
# Locale / time defaults (the installer can override per-install)
# ---------------------------------------------------------------------------
AXOS_LOCALE="${AXOS_LOCALE:-en_US.UTF-8}"
AXOS_TIMEZONE="${AXOS_TIMEZONE:-UTC}"
AXOS_KEYMAP="${AXOS_KEYMAP:-us}"
AXOS_HOSTNAME="${AXOS_HOSTNAME:-andersxn}"

# ---------------------------------------------------------------------------
# Package sets
#
# AXOS_PKGS_BASE     - bootstrapped in stage 10, present in every image.
# AXOS_PKGS_SYSTEM   - added in stage 20, the actual usable system.
# AXOS_PKGS_LIVE     - live/installer ISO only, never in an installed system.
# ---------------------------------------------------------------------------
AXOS_PKGS_BASE="${AXOS_PKGS_BASE:-\
systemd,systemd-sysv,dbus,udev,ca-certificates,locales,tzdata,\
apt-utils,gnupg,curl,less,nano}"

AXOS_PKGS_SYSTEM="${AXOS_PKGS_SYSTEM:-\
linux-image-ARCH firmware-linux-free initramfs-tools \
systemd-resolved systemd-timesyncd \
zsh git neovim btop fastfetch \
openssh-server sudo polkitd \
btrfs-progs dosfstools e2fsprogs xfsprogs f2fs-tools \
gdisk parted cryptsetup lvm2 efibootmgr \
iproute2 iputils-ping nftables \
bash-completion man-db kbd console-setup pciutils usbutils lsb-release \
plymouth plymouth-themes \
xz-utils zstd rsync jq}"

# Live/installer ISO only. NEVER in an installed system.
#
# live-config is deliberately ABSENT. It creates its own live user and rewrites
# the tty1 autologin at boot, which fights the AndersXn live session; when its
# account creation does not complete you get agetty autologging into a user
# that does not exist - "Authentication failure" in a respawn loop. AndersXn
# creates its live user at build time instead. See AXOS_LIVE_USER.
AXOS_PKGS_LIVE="${AXOS_PKGS_LIVE:-\
live-boot live-boot-initramfs-tools \
squashfs-tools \
network-manager network-manager-gnome \
wireless-tools wpasupplicant}"

# KDE Plasma. Shipped on the live ISO and installed by default.
#
# Installed WITH recommends (see stage 25): the base system keeps
# Install-Recommends "false", but Plasma genuinely needs its recommended
# packages to be a working desktop rather than a shell with missing pieces.
#
# The VMSVGA/framebuffer drivers come from AXOS_PKGS_VIDEO_* below. Debian
# dropped virtualbox-guest-x11/-utils: the kernel carries vboxvideo now, and
# clipboard sharing / auto-resize come from the Guest Additions ISO if wanted.
AXOS_PKGS_DESKTOP="${AXOS_PKGS_DESKTOP:-\
kde-plasma-desktop sddm sddm-theme-breeze \
kwin-x11 plasma-nm plasma-pa \
konsole dolphin systemsettings \
breeze breeze-gtk-theme kde-config-gtk-style \
xserver-xorg \
xserver-xorg-input-all xinit dbus-x11 x11-xserver-utils \
fonts-jetbrains-mono fonts-dejavu-core fonts-noto-color-emoji \
pipewire pipewire-pulse wireplumber \
spice-vdagent}"

# Video drivers, per architecture.
#
# xserver-xorg-video-vmware drives the VMSVGA adapter VirtualBox and VMware
# present on PCs. It is x86-only - there is no arm64 build, and asking for
# it there fails the whole desktop install. On arm64 the kernel's own KMS
# drivers (vc4 on a Pi, simpledrm elsewhere) plus the generic framebuffer
# cover the hardware.
AXOS_PKGS_VIDEO_AMD64="${AXOS_PKGS_VIDEO_AMD64:-\
xserver-xorg-video-vmware xserver-xorg-video-fbdev}"
AXOS_PKGS_VIDEO_ARM64="${AXOS_PKGS_VIDEO_ARM64:-\
xserver-xorg-video-fbdev}"

# What the graphical installer needs. PyGObject rather than a compiled toolkit
# binding: no CGO, so nothing here has to be cross-compiled, and the front end
# stays readable and patchable on the live medium itself.
AXOS_PKGS_INSTALLER_GUI="${AXOS_PKGS_INSTALLER_GUI:-\
python3-gi python3-gi-cairo gir1.2-gtk-4.0 libgtk-4-1 gir1.2-glib-2.0}"

# The unprivileged account the live session runs as. Created at BUILD time, so
# nothing has to succeed at boot for the desktop to come up.
AXOS_LIVE_USER="${AXOS_LIVE_USER:-axos}"

# Raspberry Pi support, arm64 only.
#
# The Pi does not boot via UEFI. Its bootloader reads config.txt from the
# root of the FAT partition and loads the kernel and device tree itself, so
# a Pi-bootable image needs the firmware blobs and DTBs sitting next to the
# kernel. Generic arm64 machines boot the same partition through
# EFI/BOOT/BOOTAA64.EFI and ignore config.txt entirely - which is what lets
# one image serve both.
AXOS_PKGS_ARM_FIRMWARE="${AXOS_PKGS_ARM_FIRMWARE:-\
raspi-firmware firmware-brcm80211 bluez-firmware}"

# Raspberry Pi models the generated config.txt targets. The Pi 5 loads its
# firmware from EEPROM; the Pi 4 and earlier need start*.elf on the card,
# which raspi-firmware supplies.
AXOS_PI_MODELS="${AXOS_PI_MODELS:-4 5}"

# Raspberry Pi kernel, arm64 only.
#
# Debian's mainline arm64 kernel does not adequately drive a Pi 5: BCM2712 and
# especially the RP1 southbridge - which carries USB, Ethernet and most I/O -
# were only partly supported at 6.12, and a Pi 5 booting that kernel drops to
# an initramfs shell unable to find its root device. Raspberry Pi OS ships the
# Foundation's kernel tree for exactly this reason, so AndersXn does too.
#
# The image carries BOTH: the Pi boot path loads these, while generic arm64
# UEFI machines keep booting Debian's linux-image-arm64 through Limine.
AXOS_RPI_REPO="${AXOS_RPI_REPO:-https://archive.raspberrypi.com/debian}"
AXOS_RPI_SUITE="${AXOS_RPI_SUITE:-trixie}"
AXOS_RPI_KEY_URL="${AXOS_RPI_KEY_URL:-https://archive.raspberrypi.com/debian/raspberrypi.gpg.key}"

# rpi-2712 is the Pi 5; rpi-v8 covers the Pi 4, 400, CM4, Pi 3 and Zero 2 W.
# config.txt selects between them with [pi5] / [pi4] conditional filters.
AXOS_PKGS_PI_KERNEL="${AXOS_PKGS_PI_KERNEL:-linux-image-rpi-2712 linux-image-rpi-v8}"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
AXOS_WORKDIR="${AXOS_WORKDIR:-$AXOS_ROOT/work/$AXOS_ARCH}"
AXOS_ROOTFS="${AXOS_ROOTFS:-$AXOS_WORKDIR/rootfs}"
AXOS_DISTDIR="${AXOS_DISTDIR:-$AXOS_ROOT/dist}"
AXOS_IMAGE_BASENAME="${AXOS_IMAGE_BASENAME:-andersxn-os-${AXOS_VERSION}-${AXOS_ARCH}}"

# Raw disk image size for the arm64 appliance image, in MiB.
AXOS_RAW_IMAGE_MIB="${AXOS_RAW_IMAGE_MIB:-9216}"

# Compress the release artifacts with zstd when finished.
AXOS_COMPRESS="${AXOS_COMPRESS:-1}"
