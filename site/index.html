<style>
/* ---------------------------------------------------------------------------
   AndersXn OS - splash.

   One screen: the mark, the name, two downloads. Deliberately single-theme -
   this page is the boot splash, so a light variant would contradict the only
   thing it exists to show. Every colour is painted from a token and the body
   ground is explicit, so it holds on whatever the host renders behind it.

   Palette is the system's own, from build/lib/common.sh.
--------------------------------------------------------------------------- */
:root {
  --ink:     #0B0E14;
  --lift:    #131A26;
  --surface: #131722;
  --edge:    #1E293B;
  --snow:    #F2F5FA;
  --accent:  #4FC3F7;
  --muted:   #6B7A90;

  --display: "Archivo Black", "Archivo", "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--ink);
  color: var(--snow);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
}

.screen {
  min-height: 100vh;   /* fallback for older engines */
  min-height: 100svh;  /* smallest viewport - never taller than what is shown */
  display: grid;
  /* Three rows: flexible top, the mark, then the downloads pinned low. The
     top row is fractionally larger than the bottom so the mark sits just
     above true centre, which reads as centred rather than low. */
  grid-template-rows: 1.15fr auto 1fr;
  justify-items: center;
  padding: 40px 24px;
  background: radial-gradient(115% 85% at 50% 42%, var(--lift) 0%, var(--ink) 60%);
}

.brand {
  grid-row: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
}

.mark {
  width: clamp(112px, 17vw, 168px);
  height: auto;
  display: block;
}

h1 {
  margin: 0;
  font-size: clamp(34px, 6.6vw, 66px);
  font-weight: 400;   /* Archivo Black is already black; 400 IS its weight */
  letter-spacing: -0.032em;
  line-height: 1;
  text-wrap: balance;
  text-align: center;
}

/* --- downloads ------------------------------------------------------------
   Two peers, identically weighted: neither architecture is the default, and
   styling one as primary would imply a recommendation that does not exist. */
.downloads {
  grid-row: 3;
  align-self: end;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 232px;
  padding: 15px 28px;
  background: var(--snow);
  color: var(--ink);
  border: 1px solid var(--snow);
  border-radius: 8px;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 400;   /* Archivo Black is already black - see the wordmark */
  /* A black weight at button size closes up, so it needs a hair more tracking
     than the wordmark, which is set tight because it is large. */
  letter-spacing: 0.012em;
  text-decoration: none;
  transition: background 160ms ease, color 160ms ease;
}

/* Hover inverts rather than tints: on a two-colour button the cleanest
   interaction is to swap the two colours, and the border keeps the button's
   footprint identical so nothing shifts under the cursor. */
.btn:hover,
.btn:focus-visible {
  background: var(--ink);
  color: var(--snow);
}
.btn:focus-visible { outline: 2px solid var(--snow); outline-offset: 3px; }

/* Short viewports: shrink the composition rather than let it overflow. */
@media (max-height: 640px) {
  .screen { padding: 24px 20px; }
  .brand { gap: 20px; }
  .mark { width: clamp(72px, 13vh, 116px); }
  h1 { font-size: clamp(26px, 5.6vh, 42px); }
  .btn { min-width: 196px; padding: 12px 22px; font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
